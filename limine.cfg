# ============================================================================
# limine.cfg -- read by the Limine bootloader from the root of the OS filesystem
# (or embedded via `limine deploy`). Timeout is in seconds; 3 gives you time to
# pick an entry if you add more later.
#
# NOTE: kernel_path accepts BOTH absolute paths and paths relative to this
# config file's directory depending on protocol revision; we use absolute
# /boot/... which works with every Limine >= 5.x release.
# ============================================================================

TIMEOUT=3

:Nimos (Nim x86_64)
PROTOCOL=limine

# Our ELF64 kernel. Must be built with linker/kernel.ld at 0xFFFFFFFF80100000.
KERNEL_PATH=boot:///boot/nimos.bin

# RAM disk image produced by `make disk` (tools/mknimfs). Mounted by ramfs.nim.
MODULE_PATH=boot:///boot/initrd.img
MODULE_STRING=nimos-initrd

# Optional: append console boot args here; kernel ignores cmdline for now.
# KERNEL_CMDLINE=loglevel=info
