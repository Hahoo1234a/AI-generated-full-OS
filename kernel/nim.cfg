# ============================================================================
# kernel/nim.cfg -- bare-metal compilation flags for the NIMOS kernel.
#
# Nim picks up this file automatically whenever `nim c` is invoked with a
# source file inside kernel/ (or with --path:kernel). Every flag below is
# load-bearing; removing one breaks the standalone build:
#
#   --os:standalone   : no host OS. Disables everything that would link libc
#                       (sockets, procexec, termios...). The runtime expects
#                       sys/{panicoverride,platform}.nim to exist.
#   --mm:orc
#                       (implies destructors; strings/seqs allocate via kmalloc).
#   --useMaxSize:128MB
#                       `ref` allocation and finalizers are compile errors --
#                       we hand-roll a PMM/kmalloc instead.
#   --opt:size        : smaller code = faster boots in QEMU; also avoids some
#                       aggressive loop unrolling that bloats the binary.
#   --stackTrace:off  : stack traces need the debug runtime + host IO.
#   --lineTrace:off   : ditto (no line info embedded).
#   --checks:off      : disables range/index/overflow/cast checks; indexCheck
#                       failures would call raiseIndexError -> panic -> our
#                       infinite hlt loop. On bare metal we want defined,
#                       silent behavior and explicit error codes instead.
#   --boundChecks:off : same reason, kept explicit for clarity.
#                       branch in every single access.
#   --passC:-ffreestanding : tell GCC we're freestanding (no hosted assumes)
#   --passC:-fno-stack-protector : can't call __stack_chk_fail (no libc)
#   --passC:-fno-pie               : we link at fixed addresses ourselves
#   --passC:-mno-red-zone          : interrupt handlers run on the same stack;
#                       the 128-byte red zone would be clobbered by IRQs.
#   --passC:-mcmodel=kernel        : link in the -0x800...0..-0x1000...0 window;
#                       lets us reference HHDM-mapped high addresses directly.
#   --passL:-nostdlib              : do not link libc/libgcc startup or support.
#   --passL:-static                : obviously.
# ============================================================================

--os:standalone
--mm:orc
--opt:size
--debuginfo

--stackTrace:off
--lineTrace:off
--checks:off
--boundChecks:off
--assertions:off

--hints:off
--warnings:off

# --- C backend switches -----------------------------------------------------
--passC:"-ffreestanding"
--passC:"-fno-stack-protector"
--passC:"-fno-pie"
--passC:"-no-pie"
--passC:"-mno-red-zone"
--passC:"-mcmodel=kernel"
--passC:"-mgeneral-regs-only"
--passC:"-std=gnu17"
--passC:"-Wno-unused-but-set-variable"
--passC:"-Wno-uninitialized"
--passC:"-Wno-return-local-addr"
--passC:"-Wno-address-of-packed-member"

# --- linker switches --------------------------------------------------------
--passL:"-nostdlib"
--passL:"-no-pie"
--passL:"-static"
--passL:"-z"

# Where kernel sources live so `import ../types` style paths resolve.
--path:"."
--passL:"-Wl,-z,noexecstack"
